name: Build Companion Desktop

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - run: npm run build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: easeverse-companion-${{ matrix.label }}
          path: |
            companion-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            companion-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            companion-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            companion-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            companion-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
