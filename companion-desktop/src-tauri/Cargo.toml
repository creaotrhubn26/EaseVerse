[package]
name = "easeverse-companion"
version = "0.1.0"
description = "EaseVerse Studio Companion — bridges Pro Tools takes into EaseVerse"
authors = ["EaseVerse"]
edition = "2024"

[lib]
name = "easeverse_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
notify = "6"
walkdir = "2"
dirs = "5"
bytes = "1"
futures-util = "0.3"
url = "2"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
