<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseVerse Studio Companion</title>
    <style>
      :root {
        --bg: #0e0f14;
        --surface: #161821;
        --border: #262833;
        --text: #f3f4f8;
        --muted: #8c8f9c;
        --accent: #ff914d;
        --danger: #ff5a6e;
        --success: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 18px;
        min-width: 520px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 14px;
        font-weight: 700;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        margin-top: 12px;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row input { flex: 1; }
      button {
        padding: 8px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }
      button.primary:disabled, button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      .status {
        margin: 14px 0;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 12px;
      }
      .status.ok { border-color: var(--success); color: var(--success); }
      .status.err { border-color: var(--danger); color: var(--danger); }
      .log {
        background: #0a0b10;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        max-height: 240px;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-top: 12px;
        color: #c8cad4;
      }
      .actions { margin-top: 14px; display: flex; gap: 8px; }
      .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>EaseVerse Studio Companion</h1>

    <label>API Base URL</label>
    <input id="apiBaseUrl" type="text" value="https://easeverse.vercel.app" />

    <label>Pairing Token</label>
    <div class="row">
      <input id="pairToken" type="text" placeholder="pair_… (generate in /admin)" />
      <button id="testBtn">Test</button>
    </div>
    <div class="hint">Token expires after 15 minutes. Generate a fresh one in https://easeverse.vercel.app/admin.</div>

    <label>Pro Tools Audio Files folder</label>
    <div class="row">
      <input id="audioWatch" type="text" placeholder="C:\\Users\\Michael\\ProTools\\Sessions\\MySong\\Audio Files" />
      <button id="pickBtn">Pick folder</button>
    </div>

    <label>External Track ID (optional — defaults to filename)</label>
    <input id="trackId" type="text" placeholder="my-song-v1" />

    <div id="status" class="status">Idle — fill in fields and press Start</div>

    <div class="actions">
      <button id="startBtn" class="primary">Start watching</button>
      <button id="stopBtn" class="danger" disabled>Stop</button>
    </div>

    <div id="log" class="log">[idle]</div>

    <script type="module">
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const { open } = window.__TAURI__.dialog;

      const $ = (id) => document.getElementById(id);
      const logBox = $("log");
      const statusBox = $("status");

      function setStatus(msg, kind) {
        statusBox.textContent = msg;
        statusBox.className = "status" + (kind ? " " + kind : "");
      }

      function appendLog(line) {
        const ts = new Date().toLocaleTimeString();
        logBox.textContent += `\n[${ts}] ${line}`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      async function loadConfig() {
        try {
          const cfg = await invoke("load_config");
          $("apiBaseUrl").value = cfg.apiBaseUrl || "https://easeverse.vercel.app";
          $("pairToken").value = cfg.pairToken || "";
          $("audioWatch").value = cfg.audioWatch || "";
          $("trackId").value = cfg.trackId || "";
        } catch (e) {
          appendLog("load_config error: " + e);
        }
      }

      function gatherConfig() {
        return {
          apiBaseUrl: $("apiBaseUrl").value.trim(),
          pairToken: $("pairToken").value.trim(),
          audioWatch: $("audioWatch").value.trim(),
          trackId: $("trackId").value.trim(),
        };
      }

      $("pickBtn").addEventListener("click", async () => {
        const path = await open({ directory: true, multiple: false });
        if (path) $("audioWatch").value = path;
      });

      $("testBtn").addEventListener("click", async () => {
        const cfg = gatherConfig();
        if (!cfg.pairToken) {
          setStatus("Pairing token missing", "err");
          return;
        }
        setStatus("Testing token…");
        try {
          const result = await invoke("test_pairing", {
            apiBaseUrl: cfg.apiBaseUrl,
            pairToken: cfg.pairToken,
          });
          if (result.ok) {
            setStatus("Token OK — ready to start watching", "ok");
          } else {
            setStatus("Token rejected: " + result.message, "err");
          }
        } catch (e) {
          setStatus("Test failed: " + e, "err");
        }
      });

      $("startBtn").addEventListener("click", async () => {
        const cfg = gatherConfig();
        if (!cfg.audioWatch || !cfg.pairToken) {
          setStatus("Need pairing token + audio folder", "err");
          return;
        }
        try {
          await invoke("save_config", { config: cfg });
          await invoke("start_watcher", { config: cfg });
          setStatus("Watching " + cfg.audioWatch, "ok");
          $("startBtn").disabled = true;
          $("stopBtn").disabled = false;
        } catch (e) {
          setStatus("Start failed: " + e, "err");
        }
      });

      $("stopBtn").addEventListener("click", async () => {
        try {
          await invoke("stop_watcher");
          setStatus("Stopped", "ok");
          $("startBtn").disabled = false;
          $("stopBtn").disabled = true;
        } catch (e) {
          setStatus("Stop failed: " + e, "err");
        }
      });

      await listen("companion-log", (event) => {
        appendLog(event.payload);
      });

      await loadConfig();
    </script>
  </body>
</html>
